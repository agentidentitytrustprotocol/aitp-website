version: 2
updates:
  # Fumadocs / Next.js site — keep npm deps current, grouped to reduce noise.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for minor+patch across the tree; majors held separately.
      minor-and-patch:
        update-types: ['minor', 'patch']
      major-updates:
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
