name: Sync Docs from All Repos

on:
  # Triggered by any source repo via repository_dispatch
  repository_dispatch:
    types: [docs-updated]

  # Manual trigger
  workflow_dispatch:

  # Fallback: scheduled sync every 6 hours
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      # This repo is the org's only private one, and on the Free plan
      # organization secrets reach public repos only — so AITP_BOT_APP_ID
      # arrives empty here even though it is set at the org level and works
      # in every sibling repo. Detect that instead of dying on it (#30).
      HAS_APP_TOKEN: ${{ secrets.AITP_BOT_APP_ID != '' }}

    steps:
      # Prefer the aitp-deps-bot App: a PR it authors triggers CI on its own,
      # where a GITHUB_TOKEN-authored one does not. Skipped when the secret is
      # unavailable; the fallback is GITHUB_TOKEN, which is how this workflow
      # ran successfully until the App token became mandatory in #17. The
      # `Validate` step below covers what the PR's own CI then misses.
      - name: Mint GitHub App token
        id: app
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AITP_BOT_APP_ID }}
          private-key: ${{ secrets.AITP_BOT_PRIVATE_KEY }}

      - name: Checkout website repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token || github.token }}

      # Source-repo checkouts. Each `path` MUST be `<repo-name>-repo` so that
      # scripts/sync-content.sh resolves it (resolve_repo checks <name>-repo first).
      - name: Checkout spec repo
        uses: actions/checkout@v7
        with:
          repository: agentidentitytrustprotocol/agentidentitytrustprotocol
          path: agentidentitytrustprotocol-repo
          sparse-checkout: |
            docs
            rfcs
            registries

      - name: Checkout implementation repo (aitp-rs)
        uses: actions/checkout@v7
        with:
          repository: agentidentitytrustprotocol/aitp-rs
          path: aitp-rs-repo
          sparse-checkout: |
            docs
            README.md

      - name: Checkout control-plane repo
        uses: actions/checkout@v7
        with:
          repository: agentidentitytrustprotocol/aitp-control-plane
          path: aitp-control-plane-repo
          sparse-checkout: |
            docs
            README.md

      - name: Checkout playground repo
        uses: actions/checkout@v7
        with:
          repository: agentidentitytrustprotocol/aitp-playground
          path: aitp-playground-repo
          sparse-checkout: |
            docs
            README.md

      - name: Checkout console repo
        uses: actions/checkout@v7
        with:
          repository: agentidentitytrustprotocol/aitp-ui-console
          path: aitp-ui-console-repo
          sparse-checkout: |
            docs
            README.md

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync content
        run: |
          chmod +x scripts/sync-content.sh
          ./scripts/sync-content.sh

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      # The sync PR does not reliably carry its own CI (a GITHUB_TOKEN-authored
      # PR does not trigger workflows), so prove the content builds here rather
      # than trusting a check that may never run.
      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate synced content
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run check-links
          npm run build

      - name: Create PR with updated content
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          commit-message: 'docs: sync content from source repos'
          title: 'docs: sync content from source repos'
          body: |
            Automated sync of documentation from the AITP source repos:
            - **Spec** (`agentidentitytrustprotocol`) — docs, RFCs, registries
            - **Implementation** (`aitp-rs`) — reference-impl docs + SDK bindings
            - **Control Plane** (`aitp-control-plane`) — service docs
            - **Playground** (`aitp-playground`) — scenario harness docs
            - **Console** (`aitp-ui-console`) — console docs (noindex)
          branch: automated/sync-docs
          delete-branch: true

      # Seven weeks of daily failures went unnoticed once (#30). A failed sync
      # means the published spec may be silently wrong, so say so somewhere a
      # human looks. One open issue at a time; re-runs comment on it instead.
      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label sync-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Sync failed again: $RUN"
            exit 0
          fi
          gh label create sync-failure --color b60205 \
            --description 'The docs sync is failing' --force >/dev/null 2>&1 || true
          {
            echo "The docs sync failed, so \`content/\` is no longer tracking the source repos."
            echo
            echo "Until this is fixed the site may publish superseded spec text."
            echo "That is how #28 happened: a normative RFC correction stayed unpublished"
            echo "for seven weeks because nothing reported the failure."
            echo
            echo "Failed run: $RUN"
            echo
            echo "To sync by hand meanwhile: run \`./scripts/sync-content.sh\`,"
            echo "commit \`content/\`, and open a PR."
          } > /tmp/sync-failure.md
          gh issue create --label sync-failure \
            --title 'ci: docs sync is failing — published content may be stale' \
            --body-file /tmp/sync-failure.md
