name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's superseded run. A run on
# main is never cancelled mid-run (it is the post-merge check against
# external state: source READMEs, live Discussion dates); if several pushes
# queue behind it, only the newest pending run is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check-links
      # The served schemas must equal the spec at the pin in data/schema-pin.json,
      # byte for byte. The spec repo is public, so a blobless clone needs no token.
      - name: Check served schemas against the pinned spec
        run: |
          git clone -q --filter=blob:none --no-checkout \
            https://github.com/agentidentitytrustprotocol/agentidentitytrustprotocol "$RUNNER_TEMP/spec"
          SPEC_DIR="$RUNNER_TEMP/spec" npm run check-schemas
      # Badge rule 2 (spec docs/conformance-badge.md): every committed report
      # passes the spec's report checker against the fixtures at its spec.commit.
      # The quickstart's code blocks must equal their source READMEs on main.
      - name: Check quickstart blocks against the source READMEs
        run: python3 scripts/sync-quickstart.py --check
      - name: Check committed conformance reports
        run: ./scripts/check-conformance-reports.sh "$RUNNER_TEMP/spec"
      # A post's review window must equal the dates its Discussion states.
      - name: Check review dates against the Discussion
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check-review-dates
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check-served-routes
